name: ac_dikari
description: "A new Flutter project."
publish_to: "none"

version: 1.0.1+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # ← tambah ini
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  http: ^1.2.1
  url_launcher: ^6.3.1
